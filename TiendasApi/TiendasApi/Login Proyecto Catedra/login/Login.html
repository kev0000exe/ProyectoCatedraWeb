    <script>
        // 1. VALIDACIÓN DE ADMINISTRADOR
        // VALIDACIÓN DE ADMINISTRADOR EN LOGIN
        document.addEventListener("DOMContentLoaded", function () {
            const correo = localStorage.getItem("correoUsuario");

            // Agregamos a Rafael a la condición
            if (correo === "kevin@hotmail.com" || correo === "rafael@gmail.com") {
                const pestanaAdmin = document.getElementById("pestana-admin");
                if (pestanaAdmin) {
                    pestanaAdmin.style.display = "list-item";
                }
            }
        });

        // 2. LÓGICA DE INICIO DE SESIÓN
        document.querySelector('.BTN--Iniciar').addEventListener('click', async function () {
            const correo = document.querySelector('.form-controlLogin').value;
            const contraseña = document.querySelector('.form-controlContraseña').value;

            if (!correo || !contraseña) {
                alert("Por favor, completa todos los campos.");
                return;
            }

            try {
                const response = await fetch("https://localhost:7151/api/Auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        correo: correo,
                        contraseña: contraseña
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    alert("Inicio de sesión exitoso");

                    // Guardamos todo lo necesario
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("correoUsuario", correo);

                    // IMPORTANTE: Guardamos el objeto completo para que el perfil lea el nombre
                    localStorage.setItem("usuario", JSON.stringify(data));

                    // Redirige
                    window.location.href = "../PaginInicio/index.html";
                } else {
                    const error = await response.text();
                    alert("Error al iniciar sesión: " + error);
                }
            } catch (error) {
                console.error("Error de red:", error);
                alert("No se pudo conectar con el servidor.");
            }
        });
    </script>
